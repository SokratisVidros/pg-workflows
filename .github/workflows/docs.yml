name: Docs

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'skills/**'
      - 'README.md'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'skills/**'
      - 'README.md'
      - 'bun.lock'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build:docs

      # Pushes to main deploy to production (pgpworkflows.dev). Other branches get
      # a preview URL. Forked PRs build but can't deploy: they have no secrets.
      - name: Deploy
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler pages deploy out
          --project-name=pg-workflows-docs
          --branch=${{ github.head_ref || github.ref_name }}
          --commit-hash=${{ github.sha }}
