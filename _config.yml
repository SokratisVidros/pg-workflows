title: pg-workflows
description: The simplest Postgres workflow engine for TypeScript. Durable execution, event-driven orchestration, and automatic retries - powered entirely by PostgreSQL.
theme: jekyll-theme-cayman
show_downloads: false

# Make relative [text](docs/foo.md) links resolve to rendered .html on Pages
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Include docs/*.md files as Pages
include:
  - docs

# Exclude non-docs files from the build
exclude:
  - node_modules
  - examples/node_modules
  # Keep packages/ui/README.md. Excluding `packages` skips the directory
  # before Jekyll can publish that page.
  - packages/pg-workflows
  - packages/ui/bin
  - packages/ui/dist
  - packages/ui/node_modules
  - packages/ui/scripts
  - packages/ui/src
  - packages/ui/standalone
  - packages/ui/package.json
  - packages/ui/tsconfig.json
  - packages/ui/tsconfig.build.json
  - packages/ui/vite.config.ts
  - packages/ui/vitest.config.ts
  - dist
  - tests
  - bun.lock
  - package.json
  - tsconfig.base.json
  - biome.json
  - CLAUDE.md
  - AGENTS.md
  - GEMINI.md
  - .clinerules
  - .cursorrules
  - .windsurfrules
  - .eslintignore
  - .biomeignore
  - .env.local
